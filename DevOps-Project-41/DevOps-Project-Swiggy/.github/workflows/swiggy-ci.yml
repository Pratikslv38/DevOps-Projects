
name: Swiggy CI - Azure ACR

on:
  push:
    branches:
      - master
    paths:
      - "DevOps-Project-41/DevOps-Project-Swiggy/**"
      - ".github/workflows/swiggy-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: swiggy
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and push to Azure ACR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Build Swiggy image
        working-directory: DevOps-Project-41/DevOps-Project-Swiggy
        run: |
          docker build \
            -t "${{ vars.AZURE_ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${{ vars.AZURE_ACR_NAME }}.azurecr.io/${IMAGE_NAME}:latest" \
            .

      - name: Push image to ACR
        run: |
          docker push "${{ vars.AZURE_ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${{ vars.AZURE_ACR_NAME }}.azurecr.io/${IMAGE_NAME}:latest"

      - name: Azure logout
        if: always()
        run: az logout
